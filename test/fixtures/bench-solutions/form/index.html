<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <style>
    :root { --ink: #1f2430; --muted: #646b7a; --line: #cfd4dd; --bad: #b3261e; --accent: #2b5fd9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6fa; color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
    main { max-width: 420px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e3e6ec; border-radius: 12px; padding: 24px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.lead { margin: 0 0 20px; color: var(--muted); }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=password] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #9bb5f2; outline-offset: 1px; }
    input[aria-invalid=true] { border-color: var(--bad); }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    .error { color: var(--bad); font-size: 0.9rem; margin-top: 4px; }
    .error:empty { display: none; }
    .check label { display: inline; font-weight: 400; margin-left: 6px; }
    button { width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #a9b6d3; cursor: not-allowed; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <form id="form" novalidate>
      <h1>Join us</h1>
      <p class="lead">Create your account. It only takes a minute.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" required>
        <div id="email-error" class="error" role="alert" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint password-error" required>
        <div id="password-hint" class="hint">At least 8 characters, with a letter and a digit.</div>
        <div id="password-error" class="error" role="alert" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" aria-describedby="confirm-error" required>
        <div id="confirm-error" class="error" role="alert" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="age">Age</label>
        <input id="age" name="age" type="text" inputmode="numeric" aria-describedby="age-error" required>
        <div id="age-error" class="error" role="alert" aria-live="polite"></div>
      </div>
      <div class="field check">
        <input id="terms" name="terms" type="checkbox" aria-describedby="terms-error" required><label for="terms">I agree to the terms</label>
        <div id="terms-error" class="error" role="alert" aria-live="polite"></div>
      </div>
      <button id="submit" type="submit" disabled>Create account</button>
    </form>
    <div id="success" role="status" hidden></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const rules = {
    email: (v) => (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? '' : 'Enter an email address like name@example.com.'),
    password: (v) => (v.length < 8 ? 'Use at least 8 characters.' : !/[A-Za-z]/.test(v) ? 'Include at least one letter.' : !/\d/.test(v) ? 'Include at least one digit.' : ''),
    confirm: (v) => (!v ? 'Type your password again.' : v !== $('password').value ? 'The passwords do not match.' : ''),
    age: (v) => { const s = v.trim(); if (!/^\d+$/.test(s)) return 'Enter your age as a whole number.'; const n = Number(s); return n < 13 || n > 120 ? 'You must be between 13 and 120.' : ''; },
    terms: () => ($('terms').checked ? '' : 'Please agree to the terms to continue.'),
  };
  const touched = new Set();
  const errorOf = (id) => rules[id]($(id).value);

  function show(id) {
    const msg = errorOf(id);
    const visible = touched.has(id) ? msg : '';
    $(`${id}-error`).textContent = visible;
    if (visible) $(id).setAttribute('aria-invalid', 'true'); else $(id).removeAttribute('aria-invalid');
  }
  const allValid = () => Object.keys(rules).every((id) => !errorOf(id));
  function refresh() { for (const id of Object.keys(rules)) show(id); $('submit').disabled = !allValid(); }

  for (const id of Object.keys(rules)) {
    const el = $(id);
    el.addEventListener('blur', () => { touched.add(id); refresh(); });
    el.addEventListener(id === 'terms' ? 'change' : 'input', () => { if (id === 'terms') touched.add(id); refresh(); });
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    for (const id of Object.keys(rules)) touched.add(id);
    refresh();
    if (!allValid()) { const bad = Object.keys(rules).find((id) => errorOf(id)); $(bad).focus(); return; }
    const email = $('email').value.trim();
    $('form').remove();
    const s = $('success');
    s.textContent = `Thanks for signing up! We've sent a welcome note to ${email}.`;
    s.hidden = false;
  });
</script>
</body>
</html>
